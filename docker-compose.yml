version: '3.8'
services:
  web:
    build: .
    command: gunicorn reisetur.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/code
      - media:/vol/web/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media:


redis:
  image: redis:7
  ports:
    - "6379:6379"

worker:
  build: .
  command: celery -A reisetur worker --loglevel=info
  volumes:
    - .:/code
    - media:/vol/web/media
  env_file:
    - .env
  depends_on:
    - web
    - redis


beat:
  build: .
  command: celery -A reisetur beat --loglevel=info
  volumes:
    - .:/code
  env_file:
    - .env
  depends_on:
    - redis


nginx:
  image: nginx:stable
  ports:
    - "80:80"
  volumes:
    - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
  depends_on:
    - web
