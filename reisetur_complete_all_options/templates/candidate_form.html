{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h3>Déposer ma candidature - Reisetür</h3>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Prénom</label>
        <input class="form-control" name="first_name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Nom</label>
        <input class="form-control" name="last_name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">WhatsApp</label>
        <input class="form-control" name="whatsapp">
      </div>
      <div class="mb-3">
        <label class="form-label">Objectif (ex: études, soins infirmiers)</label>
        <input class="form-control" name="objective">
      </div>
      <div class="mb-3">
        <label class="form-label">Dernier diplôme</label>
        <input class="form-control" name="diploma">
      </div>
      <hr>
      <div class="mb-3">
        <label class="form-label">CNI (PDF, JPG, PNG)</label>
        <input class="form-control" type="file" name="id_card">
      </div>
      <div class="mb-3">
        <label class="form-label">Passeport</label>
        <input class="form-control" type="file" name="passport">
      </div>
      <div class="mb-3">
        <label class="form-label">Diplôme (scan)</label>
        <input class="form-control" type="file" name="diploma_file">
      </div>
      <div class="mb-3">
        <label class="form-label">CV</label>
        <input class="form-control" type="file" name="cv">
      </div>
      <button class="btn btn-primary">Envoyer</button>
    </form>
  </div>
</div>
{% endblock %}
